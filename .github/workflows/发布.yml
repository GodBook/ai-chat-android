name: 发布 Android 更新

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_notes:
        description: 发布说明（可选）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    env:
      UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      KEYSTORE_PASSWORD: ${{ secrets.AI_CHAT_SIGNING_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.AI_CHAT_SIGNING_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.AI_CHAT_SIGNING_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.AI_CHAT_SIGNING_KEYSTORE_B64 }}
      RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 36 构建组件
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 测试、Lint 和构建
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --stacktrace -PUPDATE_MANIFEST_URL="$UPDATE_MANIFEST_URL"

      - name: 用固定签名证书签名并生成更新清单
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          trap 'rm -f signing.keystore' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing.keystore
          mkdir -p dist
          build_tools="$(basename "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)")"
          apksigner="$ANDROID_HOME/build-tools/$build_tools/apksigner"
          version_name="$(awk -F'"' '/versionName[[:space:]]*=/ {print $2; exit}' app/build.gradle.kts)"
          version_code="$(awk '/versionCode[[:space:]]*=/ {print $3; exit}' app/build.gradle.kts)"
          test -n "$version_name"
          test -n "$version_code"
          expected_tag="v$version_name"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
            test "$release_tag" = "$expected_tag" || { echo "标签 $release_tag 与 versionName $version_name 不一致"; exit 1; }
          else
            release_tag="$expected_tag"
          fi
          apk_name="ai-botoy-$version_name.apk"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$unsigned_apk"
          "$apksigner" sign --ks signing.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out "dist/$apk_name" "$unsigned_apk"
          "$apksigner" verify --verbose "dist/$apk_name"
          sha256="$(sha256sum "dist/$apk_name" | cut -d ' ' -f 1)"
          jq -n --argjson versionCode "$version_code" --arg versionName "$version_name" --arg downloadUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$release_tag/$apk_name" --arg sha256 "$sha256" --arg releaseNotes "${RELEASE_NOTES_INPUT:-自动构建发布}" '{versionCode: $versionCode, versionName: $versionName, downloadUrl: $downloadUrl, sha256: $sha256, releaseNotes: $releaseNotes}' > dist/latest.json
          printf '%s' "${RELEASE_NOTES_INPUT:-自动构建发布}" > dist/release-notes.md
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - name: 发布 GitHub Release
        shell: bash
        run: gh release create "$RELEASE_TAG" "dist/$APK_NAME" dist/latest.json --title "AI BOTOY $VERSION_NAME" --notes-file dist/release-notes.md
