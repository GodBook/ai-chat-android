name: 导出本地签名配置

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: 生成签名文件与配置
        env:
          KEYSTORE_PASSWORD: ${{ secrets.AI_CHAT_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AI_CHAT_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AI_CHAT_SIGNING_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.AI_CHAT_SIGNING_KEYSTORE_B64 }}
        run: |
          mkdir -p bundle
          printf '%s' "$KEYSTORE_B64" | base64 --decode > bundle/signing.keystore
          cat <<EOF > bundle/local.signing.properties
          KEYSTORE_PATH=signing.keystore
          KEY_ALIAS=$KEY_ALIAS
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: 上传构建物
        uses: actions/upload-artifact@v4
        with:
          name: local-signing-bundle
          path: bundle/
          retention-days: 1
